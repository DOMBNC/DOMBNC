<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMBNC • SYSTEM ONLINE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-[#00ff9f] font-mono relative">
    <div id="boot-screen" class="fixed inset-0 bg-[#050505] z-50 flex items-center justify-center flex-col gap-8">
        <div class="text-6xl glitch" data-text="DOMBNC">DOMBNC</div>
        <div class="w-96 h-2 bg-black border border-[#00ff9f] relative overflow-hidden">
            <div id="boot-progress" class="h-full bg-[#00ff9f] w-0 transition-all duration-1000"></div>
        </div>
    </div>
    <canvas id="matrix"></canvas><canvas id="three"></canvas>
    <div class="scanline"></div>
    <div class="relative z-10 max-w-screen-2xl mx-auto px-6 py-8">
        <h1 class="text-8xl glitch font-bold" data-text="DOMBNC">DOMBNC</h1>
        <div id="typing" class="text-2xl"></div>
        <div id="projects-grid" class="grid grid-cols-3 gap-8 mt-12"></div>
        <button onclick="openTerminal()" class="mt-8 border border-[#00eaff] p-4">OPEN TERMINAL</button>
    </div>
    <div id="terminal-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center">
        <div class="terminal w-full max-w-4xl h-[80vh] p-8 flex flex-col border border-[#00ff9f]">
            <div id="terminal-output" class="flex-1 overflow-y-auto"></div>
            <input id="terminal-input" onkeydown="if(event.key === 'Enter') handleTerminalCommand()" class="bg-transparent outline-none w-full border-t border-[#00ff9f] mt-4 pt-2">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
